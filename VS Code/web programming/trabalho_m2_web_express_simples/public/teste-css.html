<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste do Tema CSS</title>
    <link rel="stylesheet" href="tema.css">
</head>
<body>
    <h1>Teste da biblioteca CSS</h1>
    <p>Esta página serve para verificar os estilos definidos em tema.css.</p>

    <h2>Campos de formulário</h2>
    <p>
        <label for="exemploTexto">Campo de texto:</label><br>
        <input type="text" id="exemploTexto" value="Clique aqui para testar o foco">
    </p>
    <p>
        <label for="exemploSelecao">Seleção:</label><br>
        <select id="exemploSelecao">
            <option>Opção 1</option>
            <option>Opção 2</option>
        </select>
    </p>
    <p>
        <label for="exemploTextoArea">Texto de várias linhas:</label><br>
        <textarea id="exemploTextoArea" rows="3">Clique aqui para testar o foco.</textarea>
    </p>

    <h2>Tabela de exemplo</h2>
    <table>
        <thead>
            <tr><th>Obra</th><th>Autor</th><th>Tipo</th></tr>
        </thead>
        <tbody>
            <tr><td>Mona Lisa</td><td>Leonardo da Vinci</td><td>Quadro</td></tr>
            <tr><td>David</td><td>Michelangelo</td><td>Escultura</td></tr>
        </tbody>
    </table>
</body>
</html>
